name: Deploy playground (Nuxt) to GitHub Pages

# Manual only. The Vite site auto-deploys via pages.yml; run THIS to publish the
# Nuxt + Nuxt UI playground instead. GitHub Pages hosts one site per repo, so a
# run here replaces the live site until the next pages.yml run (they share the
# `pages` concurrency group). One-time: Settings → Pages → Source = GitHub Actions.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.1'
      # The playground resolves @mindpeeker/* to package source (Vite aliases),
      # so no workspace dist/build is needed.
      - name: Install
        working-directory: playground
        run: bun install --frozen-lockfile
      - name: Build (github_pages preset)
        working-directory: playground
        env:
          NUXT_APP_BASE_URL: /mindpeeker-sdk/
        run: bunx nuxt build --preset github_pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: playground/.output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
